<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARZOEE — Efficienza OEE</title>
<style>
  :root{
    --bg:#0a1016; --panel:#121b24; --panel2:#1a2733; --line:#2a3d4d;
    --ink:#e9f2f8; --muted:#8aa2b4; --accent:#3fa7ff; --good:#37d67a; --warn:#ffcf5c; --bad:#ff6b5e;
    --shadow:0 12px 44px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:radial-gradient(ellipse at 50% -10%,#10202e,var(--bg) 60%);color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-weight:300;font-size:22px;letter-spacing:4px}
  .logo b{font-weight:800;color:var(--accent)}
  .logo small{display:block;font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:2px}
  .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:11px 20px;border-radius:24px;font-weight:600;font-size:14px;transition:.2s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#04243f;border-color:var(--accent)}
  button.danger{border-color:var(--bad);color:#ffb3ad}
  button.sm{padding:7px 13px;font-size:12px}
  input{font-family:inherit;font-size:15px;background:#08121a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:block;margin-bottom:6px}
  main{max-width:840px;margin:0 auto;padding:30px 18px 80px}
  .grid-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:26px}
  .grid-in .full{grid-column:1/-1}
  .result{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
  @media(max-width:620px){.result{grid-template-columns:1fr;text-align:center}}
  .oee-big{text-align:center}
  .oee-big .val{font-size:clamp(58px,16vw,84px);font-weight:200;letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums}
  .oee-big .lab{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:6px}
  .oee-big .cls{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;border:1px solid}
  .comp .row{margin-bottom:16px}
  .comp .row:last-child{margin-bottom:0}
  .comp .head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .comp .head .nm{color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .comp .head .pc{font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:12px;border-radius:8px;background:var(--panel2);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .35s}
  .note{font-size:12px;color:var(--warn);margin-top:14px;min-height:16px;text-align:center}
  .controls{display:flex;gap:12px;justify-content:center;margin:24px 0 6px;flex-wrap:wrap}
  .hist{margin-top:30px}
  .hist h3{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px}
  .h-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
  .h-row .t{font-size:14px}
  .h-row .d{font-size:11px;color:var(--muted);margin-top:2px}
  .h-row .o{font-size:18px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);font-style:italic;padding:18px}
</style>
</head>
<body>
<header>
  <div class="logo">MARZ<b>OEE</b><small>EFFICIENZA TOTALE IMPIANTO</small></div>
  <div class="tools">
    <button class="ghost sm" onclick="exportData()">Esporta</button>
    <button class="ghost sm" onclick="document.getElementById('imp').click()">Importa</button>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">
  </div>
</header>

<main>
  <div class="grid-in">
    <div class="full"><label>Linea / turno (etichetta)</label><input id="lab" placeholder="Es. Linea montaggio · turno mattino"></div>
    <div><label>Tempo pianificato (min)</label><input type="number" id="planned" min="0" value="480" oninput="recalc()"></div>
    <div><label>Fermi totali (min)</label><input type="number" id="downtime" min="0" value="45" oninput="recalc()"></div>
    <div><label>Tempo ciclo ideale (sec/pezzo)</label><input type="number" id="ideal" min="0" step="0.1" value="30" oninput="recalc()"></div>
    <div><label>Pezzi totali prodotti</label><input type="number" id="total" min="0" value="760" oninput="recalc()"></div>
    <div><label>Pezzi scartati</label><input type="number" id="rejects" min="0" value="18" oninput="recalc()"></div>
  </div>

  <div class="result">
    <div class="oee-big">
      <div class="val" id="oeeVal">—</div>
      <div class="lab">OEE</div>
      <div class="cls" id="oeeCls" style="display:none"></div>
    </div>
    <div class="comp">
      <div class="row"><div class="head"><span class="nm">Disponibilità</span><span class="pc" id="aPc">—</span></div><div class="bar"><i id="aBar" style="width:0"></i></div></div>
      <div class="row"><div class="head"><span class="nm">Performance</span><span class="pc" id="pPc">—</span></div><div class="bar"><i id="pBar" style="width:0"></i></div></div>
      <div class="row"><div class="head"><span class="nm">Qualità</span><span class="pc" id="qPc">—</span></div><div class="bar"><i id="qBar" style="width:0"></i></div></div>
    </div>
  </div>
  <div class="note" id="note"></div>

  <div class="controls">
    <button class="primary" onclick="record()">Registra turno</button>
  </div>

  <div class="hist">
    <h3>Turni registrati</h3>
    <div id="histList"></div>
  </div>
</main>

<footer>MARZOEE · I dati restano salvati nel tuo browser. Usa Esporta per backup o per spostarli su un altro dispositivo.</footer>

<script>
const $=id=>document.getElementById(id);
const KEY='marzoee_v1';
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
S.history=S.history||[];

function num(id){const v=parseFloat($(id).value);return isFinite(v)&&v>=0?v:0}
function pct(x){return (x*100).toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}
function colorFor(o){return o>=0.85?'var(--good)':o>=0.60?'var(--warn)':'var(--bad)'}

function compute(){
  const planned=num('planned'), downtime=num('downtime'),
        ideal=num('ideal'), total=num('total'), rejects=num('rejects');
  const runTime=planned-downtime;                 // minuti operativi
  const notes=[];
  if(planned<=0) notes.push('Imposta un tempo pianificato maggiore di 0.');
  if(downtime>planned) notes.push('I fermi superano il tempo pianificato.');
  if(rejects>total) notes.push('Gli scarti superano i pezzi prodotti.');

  const avail = planned>0 ? Math.max(0,runTime)/planned : 0;
  const perfRaw = (runTime>0 && total>0) ? (ideal*total)/(runTime*60) : 0; // tempo ideale / tempo operativo
  const perf = Math.min(perfRaw,1);
  if(perfRaw>1.001) notes.push('Performance teorica >100%: verifica il tempo ciclo ideale.');
  const qual = total>0 ? Math.max(0,(total-Math.min(rejects,total)))/total : 0;
  const oee = avail*perf*qual;
  return {avail,perf,perfRaw,qual,oee,valid:planned>0,notes};
}

function recalc(){
  const r=compute();
  if(!r.valid){
    $('oeeVal').textContent='—';$('oeeCls').style.display='none';
    ['a','p','q'].forEach(k=>{$(k+'Pc').textContent='—';$(k+'Bar').style.width='0'});
    $('note').textContent=r.notes.join(' ');
    return r;
  }
  $('oeeVal').textContent=pct(r.oee);
  $('oeeVal').style.color=colorFor(r.oee);
  const cls=$('oeeCls');
  const label=r.oee>=0.85?'World class':r.oee>=0.60?'Buono':'Da migliorare';
  cls.textContent=label;cls.style.display='inline-block';
  cls.style.color=colorFor(r.oee);cls.style.borderColor=colorFor(r.oee);
  $('aPc').textContent=pct(r.avail);$('aBar').style.width=Math.min(r.avail*100,100)+'%';
  $('pPc').textContent=pct(r.perf);$('pBar').style.width=Math.min(r.perf*100,100)+'%';
  $('qPc').textContent=pct(r.qual);$('qBar').style.width=Math.min(r.qual*100,100)+'%';
  $('note').textContent=r.notes.join(' ');
  return r;
}

function record(){
  const r=compute();
  if(!r.valid){alert('Controlla i dati: il tempo pianificato deve essere maggiore di 0.');return}
  S.history.unshift({
    date:new Date().toISOString(),
    label:$('lab').value.trim(),
    planned:num('planned'),downtime:num('downtime'),ideal:num('ideal'),
    total:num('total'),rejects:num('rejects'),
    avail:r.avail,perf:r.perf,qual:r.qual,oee:r.oee
  });
  if(S.history.length>60)S.history.pop();
  save();renderHist();
}
function renderHist(){
  const l=$('histList');
  if(!S.history.length){l.innerHTML='<div class="empty">Nessun turno registrato. Compila i dati e premi “Registra turno”.</div>';return}
  l.innerHTML=S.history.map((h,i)=>{
    const d=new Date(h.date).toLocaleDateString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    const col=colorFor(h.oee);
    return '<div class="h-row"><div><div class="t">'+(esc(h.label)||'Turno senza nome')+'</div>'+
      '<div class="d">'+d+' · D '+pct(h.avail)+' · P '+pct(h.perf)+' · Q '+pct(h.qual)+'</div></div>'+
      '<div class="o" style="color:'+col+'">'+pct(h.oee)+'</div>'+
      '<button class="danger sm" onclick="delHist('+i+')">✕</button></div>';
  }).join('');
}
function delHist(i){S.history.splice(i,1);save();renderHist()}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='marzoee-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch(e){alert('File non valido')}};
  r.readAsText(f);inp.value='';
}

recalc();renderHist();
</script>
</body>
</html>
